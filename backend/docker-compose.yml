# Postgres de desenvolvimento e de teste (D8, D23). Usuário e senha vêm de backend/.env (D25.13).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dentagenda
    ports:
      # 5433 no host: a 5432 costuma estar ocupada por um Postgres instalado na máquina (D26).
      - "5433:5432"
    volumes:
      - dados:/var/lib/postgresql/data
      - ./docker/criar-banco-teste.sql:/docker-entrypoint-initdb.d/criar-banco-teste.sql:ro

volumes:
  dados: {}
