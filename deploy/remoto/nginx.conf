pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  client_max_body_size 1m;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # D47: somente o conector na rede privada pode fornecer identidade Cloudflare.
  # A rede e estes dois endereços devem ser alterados juntos se houver colisão.
  set_real_ip_from 172.30.247.2;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;
  geo $realip_remote_addr $conector_confiavel {
    default 0;
    172.30.247.2/32 1;
  }
  # Esta guarda exclui listas, portas, brackets e whitespace. A validação do IP
  # é do parser de ngx_http_realip_module: uma entrada inválida NÃO muda remote_addr.
  map $http_cf_connecting_ip $formato_de_ip_unico {
    default 0;
    ~^[0-9.]+$ 1;
    ~^[0-9a-fA-F]*:[0-9a-fA-F:.]+$ 1;
  }
  server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    # Liveness interno sem atingir API/banco. Nenhuma porta é publicada no host.
    location = /saude { access_log off; return 200 'ok'; }
    location / {
      if ($conector_confiavel = 0) { return 403; }
      if ($formato_de_ip_unico = 0) { return 400; }
      if ($remote_addr = $realip_remote_addr) { return 400; }
      if ($http_x_forwarded_proto != https) { return 400; }
      try_files $uri $uri/ /index.html;
    }
    location /api/ {
      if ($conector_confiavel = 0) { return 403; }
      if ($formato_de_ip_unico = 0) { return 400; }
      if ($remote_addr = $realip_remote_addr) { return 400; }
      if ($http_x_forwarded_proto != https) { return 400; }
      proxy_pass http://api:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Forwarded "";
      proxy_set_header X-Real-IP "";
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header CF-Connecting-IPv6 "";
      proxy_set_header True-Client-IP "";
      proxy_read_timeout 30s;
      proxy_connect_timeout 3s;
    }
  }
}
